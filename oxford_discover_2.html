<style>
:root{--cream:#fffaf1;--ink:#5e4942;--pink:#ffdfe8;--purple:#e8defd;--mint:#dff3e9;--yellow:#fff0b8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif;background:radial-gradient(circle at 4% 8%,#ffdce6 0 65px,transparent 67px),radial-gradient(circle at 96% 12%,#e5dcfa 0 85px,transparent 87px),var(--cream)}
button,input{font:inherit}.app{width:min(1180px,calc(100% - 26px));margin:auto;padding:12px 0 26px}.top{display:grid;grid-template-columns:1fr auto;align-items:center;padding:18px 25px;border:3px solid #fff;border-radius:26px;background:linear-gradient(135deg,#fff,#fff1ec);box-shadow:0 10px 28px #72584f1d}.tag{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--purple);font-size:11px;font-weight:900;letter-spacing:.08em}.top h1{margin:4px 0 1px;font-size:clamp(27px,3.3vw,40px);line-height:1.1}.top p{margin:3px 0 0;color:#987d74}.bear{width:100px;height:86px;animation:float 3s ease-in-out infinite}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin:12px 0}.search{min-width:0;padding:10px 15px;border:2px solid #eadcf6;border-radius:999px;background:#fff;color:var(--ink);outline:none}.search:focus{border-color:#a98bdb}.pill{border:0;border-radius:999px;padding:9px 14px;background:var(--mint);color:var(--ink);font-weight:900;cursor:pointer}.count{display:grid;place-items:center;background:var(--yellow);cursor:default}.units{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-bottom:11px}.unit{padding:8px 3px;border:2px solid #eadff0;border-radius:12px;background:#fff;color:#7c655d;font-size:12px;font-weight:900;cursor:pointer}.unit:hover,.unit.active{background:#745bc4;color:#fff;border-color:#745bc4}.panel{padding:17px;border:3px solid #fff;border-radius:26px;background:#ffffffdf;box-shadow:0 10px 28px #72584f1d}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.panel h2{margin:0;font-size:21px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.card{position:relative;min-height:93px;padding:13px 35px 11px 13px;border:2px solid #f2dfe4;border-radius:17px;background:#fff5f6;text-align:left;color:var(--ink);cursor:pointer;transition:.18s}.card:nth-child(4n+2){background:#f6f2ff;border-color:#e3daf5}.card:nth-child(4n+3){background:#f1faf6;border-color:#d8eee3}.card:nth-child(4n){background:#fff9e7;border-color:#f2e7bd}.card:hover{transform:translateY(-2px);box-shadow:0 7px 15px #72584f18}.en{display:block;font-size:16px;font-weight:950;line-height:1.25}.zh{display:block;margin-top:5px;color:#8a6e65;font-size:14px}.pos{display:inline-block;margin-left:4px;color:#aa8fa4;font-size:11px;font-weight:700}.sound{position:absolute;right:10px;top:10px;font-size:17px}.empty{grid-column:1/-1;padding:40px;text-align:center;color:#a78e86}.home{display:inline-block;margin-top:12px;color:#795eb9;font-weight:900;text-decoration:none}@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){.units{grid-template-columns:repeat(6,1fr)}.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.top{padding:16px 18px}.bear{display:none}.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.units{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.panel{padding:13px}.panel-head{align-items:flex-start;flex-direction:column}}@media(max-width:390px){.cards{grid-template-columns:1fr}}
.practice-launch{width:100%;margin:0 0 11px;border:0;border-radius:14px;padding:11px;background:#745bc4;color:#fff;font-weight:900;cursor:pointer}.practice{display:none;margin:11px 0;padding:18px;border:3px solid #fff;border-radius:26px;background:#fff;box-shadow:0 10px 28px #72584f1d;text-align:center}.practice.open{display:block}.practice-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.practice h2{margin:0;font-size:22px}.question-count{padding:6px 11px;border-radius:999px;background:var(--yellow);font-weight:900}.clue{margin:18px 0 4px;font-size:clamp(28px,4vw,42px);font-weight:950}.answer{min-height:64px;margin:14px auto;padding:11px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px;border:3px dashed #d9c9ee;border-radius:18px;background:#faf7ff}.answer.empty:after{content:'點選下方字母開始拼字';color:#ad9fba;font-weight:700}.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:13px 0}.letter,.chosen{width:48px;height:52px;border:2px solid #7a5bc5;border-radius:13px;background:#fff;color:#6547ad;font-size:24px;font-weight:950;cursor:pointer;box-shadow:0 4px 0 #d7c9ef}.letter:disabled{opacity:.18;cursor:default}.chosen{background:#f3edff}.feedback{min-height:30px;margin:8px;font-size:18px;font-weight:900}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.action{border:0;border-radius:14px;padding:11px 18px;background:#eee8f7;color:#604b76;font-weight:900;cursor:pointer}.action.primary{background:#745bc4;color:#fff}.action.sound-btn{background:#e1f3ff;color:#33789b}

<body><main class="app">
<header class="top"><div><span class="tag">NANCY'S VOCABULARY GARDEN</span><h1>Oxford Discover 2<br>單字樂園</h1><p>選擇 Unit，點一下單字就能聽發音！</p></div>
<svg class="bear" viewBox="0 0 120 100" role="img" aria-label="可愛小熊"><circle cx="31" cy="27" r="18" fill="#9c684b"/><circle cx="89" cy="27" r="18" fill="#9c684b"/><circle cx="31" cy="27" r="9" fill="#f1aa79"/><circle cx="89" cy="27" r="9" fill="#f1aa79"/><ellipse cx="60" cy="55" rx="43" ry="40" fill="#a97050"/><ellipse cx="60" cy="67" rx="23" ry="19" fill="#ffd6ad"/><circle cx="45" cy="49" r="4" fill="#3d2b28"/><circle cx="75" cy="49" r="4" fill="#3d2b28"/><path d="M54 60 Q60 56 66 60 Q64 67 60 67 Q56 67 54 60" fill="#55352f"/><path d="M60 67 Q60 76 51 75 M60 67 Q60 76 69 75" fill="none" stroke="#55352f" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="32" cy="65" rx="7" ry="4" fill="#ef9cae"/><ellipse cx="88" cy="65" rx="7" ry="4" fill="#ef9cae"/></svg></header>
<div class="toolbar"><input class="search" id="search" type="search" placeholder="🔎 搜尋英文或中文"><button class="pill" id="listenAll">🔊 播放本單元</button><span class="pill count" id="count"></span></div>
<nav class="units" id="units" aria-label="單元選擇"></nav>
<section class="panel"><div class="panel-head"><h2 id="title"></h2><span id="subtitle"></span></div><div class="cards" id="cards"></div></section>
<a class="home" href="index.html">← 回單字練習首頁</a>
<section class="practice" id="practice" aria-label="重組單字練習"><div class="practice-top"><h2>🧩 重組單字練習</h2><span class="question-count" id="questionCount"></span></div><div class="clue" id="clue"></div><button class="action sound-btn" id="hearWord">🔊 聽發音</button><div class="answer empty" id="answer"></div><div class="letters" id="letters"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="action" id="undoLetter">↩ 撤回</button><button class="action" id="reshuffle">🔀 重新排列</button><button class="action primary" id="checkAnswer">✓ 檢查答案</button><button class="action" id="skipWord">跳過／下一題 →</button><button class="action" id="closePractice">關閉練習</button></div></section>
</main>
<script>
const raw=[
['Amazing Animals','skin(n.)皮膚 / mammals(n.)哺乳動物 / eggs(n.)蛋,卵 / amphibians(n.)兩棲動物 / scales(n.)鱗片 / gills(n.)鰓 / feathers(n.)羽毛 / wings(n.)翅膀 / fur(n.)毛皮 / head(n.)頭 / eye(n.)眼睛 / ear(n.)耳朵 / mouth(n.)嘴巴 / leg(n.)腿 / body(n.)身體'],
['Leo and Lily\'s Adventure','worm(n.)蠕蟲 / berries(n.)莓果 / hunt(v.)狩獵 / escape(v.)逃跑 / creep(v.)爬行 / fight(v./n.)打架 / peck(v.)啄 / pinecone(n.)松果 / squawk(v./n.)嘎嘎叫 / strong(adj.)強壯的 / gentle(adj.)溫和的 / patient(adj.)有耐心的 / smart(adj.)聰明的 / calm(adj.)冷靜的 / fierce(adj.)兇猛的'],
['What Is Our World Made Of?','flow(v.)流動 / solid(n./adj.)固體 / liquid(n./adj.)液體 / gas(n.)氣體 / heat(v./n.)加熱 / steam(n.)蒸氣 / ice(n.)冰 / freeze(v.)結冰 / melt(v.)融化 / ice pop(n.)冰棒 / balloon(n.)氣球 / kettle(n.)水壺 / popcorn(n.)爆米花 / icicle(n.)冰柱 / candle(n.)蠟燭'],
['Let\'s Make Ice Cream!','cream(n.)鮮奶油 / sugar(n.)糖 / salt(n.)鹽 / pour(v.)倒 / plastic bags(n.phr.)塑膠袋 / mixture(n.)混合物 / open(adj./v.)打開的 / closed(adj.)關閉的 / freezer(n.)冷凍庫 / coffee(n.)咖啡 / tea(n.)茶 / salad(n.)沙拉 / fruit(n.)水果 / vegetables(n.)蔬菜 / pasta(n.)義大利麵'],
['Then and Now','travel(v./n.)旅行 / communication(n.)通訊 / airplane(n.)飛機 / news(n.)新聞 / letter(n.)信件 / text message(n.phr.)簡訊 / e-mail(n./v.)電子郵件 / radio(n.)廣播 / Internet(n.)網際網路 / boat(n.)船 / bus(n.)公車 / motorcycle(n.)摩托車 / cable car(n.phr.)纜車 / truck(n.)卡車 / horse(n.)馬'],
['Tell Me a Story, Grandpa','arrive(v.)到達 / ask(v.)詢問 / check(v.)檢查 / enter(v.)進入 / poor(adj.)貧窮的 / crowded(adj.)擁擠的 / clerk(n.)店員 / visit(v.)拜訪 / sick(adj.)生病的 / couch(n.)沙發 / chair(n.)椅子 / lamp(n.)檯燈 / clock(n.)時鐘 / bathtub(n.)浴缸 / sink(n.)洗手台'],
['Subtraction','minus sign(n.phr.)減號 / subtraction(n.)減法 / take away(v.phr.)減去 / column(n.)直欄 / row(n.)橫列 / test score(n.phr.)考試分數 / single-digit number(n.phr.)單位數 / double-digit number(n.phr.)雙位數 / left(adj.)剩下的 / clean(adj./v.)乾淨的 / dirty(adj.)髒的 / tired(adj.)疲倦的 / hungry(adj.)飢餓的 / thirsty(adj.)口渴的 / full(adj.)飽的'],
['Bandar, the Greedy Monkey','let go(v.phr.)放手 / steal(v.)偷竊 / dig up(v.phr.)挖出 / hide(v.)躲藏 / jar(n.)罐子 / greedy(adj.)貪心的 / bored(adj.)無聊的 / baker(n.)烘焙師 / cook(n./v.)廚師 / knee(n.)膝蓋 / nose(n.)鼻子 / foot(n.)腳 / arm(n.)手臂 / face(n.)臉 / hand(n.)手'],
['Following Rules','traffic light(n.phr.)紅綠燈 / take turns(v.phr.)輪流 / polite(adj.)有禮貌的 / clean up(v.phr.)清理 / litter(v./n.)亂丟垃圾 / librarian(n.)圖書館員 / crossing guard(n.phr.)導護人員 / principal(n.)校長 / lifeguard(n.)救生員 / kitchen(n.)廚房 / living room(n.phr.)客廳 / cafeteria(n.)自助餐廳 / classroom(n.)教室 / swimming pool(n.phr.)游泳池 / crosswalk(n.)斑馬線'],
['The Please and Thank You Book Poems','knock(v.)敲門 / thoughtful(adj.)體貼的 / rude(adj.)無禮的 / grab(v.)抓取 / pass(v.)傳遞 / put away(v.phr.)收好 / invite(v.)邀請 / wash(v.)洗 / share(v.)分享 / computer(n.)電腦 / laptop(n.)筆記型電腦 / camera(n.)相機 / headphones(n.)耳機 / tablet(n.)平板電腦 / cell phone(n.phr.)手機'],
['Natural Resources','resources(n.)資源 / wood(n.)木頭,木材 / landfill(n.)垃圾掩埋場 / land(n.)土地 / trash(n.)垃圾 / smoke(n.)煙霧 / sunlight(n.)陽光 / reduce(v.)減少 / reuse(v.)重複使用 / camp(v./n.)露營 / hike(v./n.)健行 / ride a horse(v.phr.)騎馬 / surf(v.)衝浪 / fish(v./n.)釣魚 / ski(v./n.)滑雪'],
['A Juice Carton\'s Diary','carton(n.)紙盒 / diary(n.)日記 / paper(n.)紙張 / blow(v.)吹 / shelf(n.)架子,貨架 / recycling plant(n.phr.)資源回收廠 / machine(n.)機器 / stationery store(n.phr.)文具店 / rescue(v.)救援 / time(n.)時間 / week(n.)星期 / nine o\'clock(n.phr.)九點鐘 / nine-fifteen(n.phr.)九點十五分 / nine-thirty(n.phr.)九點三十分 / nine forty-five(n.phr.)九點四十五分'],
['How Music Makes us Feel','high(adj.)高音的 / low(adj.)低音的 / excited(adj.)興奮的 / sleepy(adj.)想睡的 / wolf(n.)狼 / feelings(n.)感受,情緒 / right(adj.)正確的 / wrong(adj.)錯誤的 / trumpet(n.)小號,喇叭 / proud(adj.)驕傲的 / smile(v./n.)微笑 / nervous(adj.)緊張的 / yawn(v./n.)打哈欠 / unhappy(adj.)不快樂的 / cry(v.)哭泣'],
['Olga\'s Flute','notes(n.)音符 / wait(v.)等待 / worried(adj.)擔心的 / the flu(n.phr.)流行性感冒 / tears(n.)眼淚 / solo(n.)獨奏 / hummingbird(n.)蜂鳥 / record(v.)錄音,紀錄 / musician(n.)音樂家 / have lunch(v.phr.)吃午餐 / give a concert(v.phr.)舉辦音樂會 / make a mistake(v.phr.)犯錯 / sign an autograph(v.phr.)簽名(給粉絲) / talk to fans(v.phr.)和粉絲說話 / do an interview(v.phr.)接受採訪'],
['Forces and Movement','push(v./n.)推 / pull(v./n.)拉 / movement(n.)移動 / ground(n.)地面 / throw(v.)丟,擲 / speed(n.)速度 / heavy(adj.)重的 / light(adj.)輕的 / easy(adj.)簡單的,容易的 / computer mouse(n.phr.)電腦滑鼠 / stapler(n.)釘書機 / suitcase(n.)行李箱 / broom(n.)掃把 / door(n.)門 / desk drawer(n.phr.)書桌抽屜'],
['Two Stubborn Little Goats','stubborn(adj.)固執的 / angry(adj.)生氣的 / goat(n.)山羊 / mountain(n.)山 / west(n./adj.)西方(的) / east(n./adj.)東方(的) / forward(adv.)向前 / horns(n.)角 / wet(adj.)濕的 / basketball(n.)籃球 / soccer(n.)足球 / tennis(n.)網球 / baseball(n.)棒球 / hockey(n.)曲棍球 / golf(n.)高爾夫球'],
['Shapes in Art','crescent(n.)弦月形,新月 / star(n.)星形 / spiral(n.)螺旋形 / oval(n.)橢圓形 / straight(adj.)直的 / nature(n.)大自然 / collage(n.)拼貼畫 / sculpture(n.)雕塑品 / pattern(n.)圖案,模式 / photograph(n.)照片 / origami(n.)摺紙藝術 / drawing(n.)畫作,素描 / mobile(n.)懸掛飾品,風鈴 / oil painting(n.phr.)油畫 / mosaic(n.)馬賽克'],
['Origami','shiny(adj.)閃亮的 / fold(v.)摺 / edge(n.)邊緣 / crane(n.)鶴 / seal(n.)海豹 / crumple(v.)弄皺 / waves(n.)海浪 / climb(v.)攀爬 / golden(adj.)金色的 / markers(n.)麥克筆 / scissors(n.)剪刀 / glue(n.)膠水 / watercolors(n.)水彩 / chalk(n.)粉筆 / colored pencils(n.phr.)色鉛筆']
];
const units=raw.map(([title,list],i)=>({number:i+1,title,words:list.split(' / ').map(item=>{const m=item.match(/^(.*?)\(([^)]+)\)(.*)$/);return m?{en:m[1],pos:m[2],zh:m[3]}:{en:item,pos:'',zh:''}})}));
let current=0;const unitNav=document.querySelector('#units'),cards=document.querySelector('#cards'),title=document.querySelector('#title'),subtitle=document.querySelector('#subtitle'),search=document.querySelector('#search'),count=document.querySelector('#count');
units.forEach((u,i)=>{const b=document.createElement('button');b.className='unit'+(i===0?' active':'');b.textContent=`Unit ${i+1}`;b.onclick=()=>showUnit(i);unitNav.appendChild(b)});
function speak(word){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.76;speechSynthesis.speak(u)}
function draw(words,heading,sub){title.textContent=heading;subtitle.textContent=sub;cards.innerHTML='';count.textContent=`${words.length} 個單字`;if(!words.length){cards.innerHTML='<div class="empty">找不到符合的單字 🐾</div>';return}words.forEach(w=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<span class="sound">🔊</span><span class="en">${w.en}<span class="pos">${w.pos}</span></span><span class="zh">${w.zh}</span>`;b.onclick=()=>speak(w.en);cards.appendChild(b)})}
function showUnit(i){current=i;search.value='';document.querySelectorAll('.unit').forEach((b,n)=>b.classList.toggle('active',n===i));draw(units[i].words,`Unit ${i+1}｜${units[i].title}`,'點擊任一單字播放發音')}
search.oninput=()=>{const q=search.value.trim().toLowerCase();if(!q){showUnit(current);return}const found=units.flatMap(u=>u.words).filter(w=>w.en.toLowerCase().includes(q)||w.zh.includes(search.value.trim()));draw(found,`搜尋「${search.value}」`,'搜尋全部 18 個單元')};
document.querySelector('#listenAll').onclick=async()=>{const words=search.value?units.flatMap(u=>u.words).filter(w=>w.en.toLowerCase().includes(search.value.toLowerCase())||w.zh.includes(search.value.trim())):units[current].words;speechSynthesis.cancel();for(const w of words){await new Promise(resolve=>{const u=new SpeechSynthesisUtterance(w.en);u.lang='en-US';u.rate=.76;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}};
const launch=document.createElement('button');launch.id='startPractice';launch.className='practice-launch';launch.textContent='🧩 開始重組單字練習';document.querySelector('.panel').before(launch);
const practice=document.querySelector('#practice'),clue=document.querySelector('#clue'),lettersBox=document.querySelector('#letters'),answerBox=document.querySelector('#answer'),feedback=document.querySelector('#feedback'),questionCount=document.querySelector('#questionCount');let quizWords=[],quizIndex=0,letterTiles=[],chosenTiles=[];const normalized=s=>s.toLowerCase().replace(/[^a-z]/g,'');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function setupQuestion(){const w=quizWords[quizIndex];chosenTiles=[];letterTiles=shuffle([...normalized(w.en)].map((char,id)=>({char,id,used:false})));clue.textContent=w.zh;questionCount.textContent=`第 ${quizIndex+1} 題／共 ${quizWords.length} 題`;feedback.textContent='';drawLetters();speak(w.en)}function drawLetters(){answerBox.innerHTML='';answerBox.classList.toggle('empty',!chosenTiles.length);chosenTiles.forEach(tile=>{const b=document.createElement('button');b.className='chosen';b.textContent=tile.char;b.onclick=()=>removeTile(tile);answerBox.appendChild(b)});lettersBox.innerHTML='';letterTiles.forEach(tile=>{const b=document.createElement('button');b.className='letter';b.textContent=tile.char;b.disabled=tile.used;b.onclick=()=>{tile.used=true;chosenTiles.push(tile);feedback.textContent='';drawLetters()};lettersBox.appendChild(b)})}function removeTile(tile){tile.used=false;chosenTiles=chosenTiles.filter(t=>t!==tile);feedback.textContent='';drawLetters()}function nextQuestion(){quizIndex=(quizIndex+1)%quizWords.length;setupQuestion()}
launch.onclick=()=>{quizWords=[...units[current].words];shuffle(quizWords);quizIndex=0;practice.classList.add('open');setupQuestion();practice.scrollIntoView({behavior:'smooth',block:'start'})};document.querySelector('#hearWord').onclick=()=>speak(quizWords[quizIndex].en);document.querySelector('#undoLetter').onclick=()=>{if(chosenTiles.length)removeTile(chosenTiles[chosenTiles.length-1])};document.querySelector('#reshuffle').onclick=()=>{chosenTiles.forEach(t=>t.used=false);chosenTiles=[];shuffle(letterTiles);feedback.textContent='';drawLetters()};document.querySelector('#checkAnswer').onclick=()=>{const right=normalized(quizWords[quizIndex].en),answer=chosenTiles.map(t=>t.char).join('');if(answer===right){feedback.textContent=`🎉 答對了！${quizWords[quizIndex].en}`;feedback.style.color='#39835c';speak(quizWords[quizIndex].en)}else{feedback.textContent=answer.length<right.length?'還有字母沒選完喔！':'再試一次，你快答對了！';feedback.style.color='#c45d75'}};document.querySelector('#skipWord').onclick=nextQuestion;document.querySelector('#closePractice').onclick=()=>{practice.classList.remove('open');speechSynthesis.cancel()};showUnit(0);
</script></body></html>
