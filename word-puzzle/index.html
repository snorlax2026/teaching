<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文單字拼字測驗</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f3e9f8;
            background-image: 
                radial-gradient(circle at 10% 20%, #fff9d6 0%, #fff9d6 12%, transparent 13%),
                radial-gradient(circle at 90% 80%, #ffd6e0 0%, #ffd6e0 15%, transparent 16%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 30px rgba(110, 80, 160, 0.12);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .unit-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #4a4a4a;
        }

        .home-btn {
            background-color: #6c5ce7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .progress-bar {
            height: 8px;
            background-color: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff7675, #ffeaa7);
            width: 0%;
            transition: width 0.3s ease;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .nav-btn {
            background: white;
            border: 1px solid #dcdde1;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            color: #6c5ce7;
            font-weight: bold;
        }

        .audio-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
            background: none;
            border: none;
            color: #0984e3;
            cursor: pointer;
            font-size: 0.95rem;
            gap: 5px;
        }

        .hint-text {
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .answer-box {
            border: 2px dashed #a29bfe;
            border-radius: 16px;
            min-height: 60px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 10px;
            gap: 8px;
            margin-bottom: 20px;
            background-color: #fafafa;
        }

        .letter-pool {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .letter-btn {
            width: 42px;
            height: 42px;
            background: white;
            border: 2px solid #a29bfe;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2d3436;
            cursor: pointer;
            box-shadow: 0 3px 0 #a29bfe;
            transition: all 0.1s ease;
        }

        .letter-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .letter-btn.used {
            opacity: 0.2;
            pointer-events: none;
        }

        .action-btns {
            display: flex;
            gap: 15px;
        }

        .reset-btn, .check-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-btn {
            background-color: #f1f2f6;
            color: #747d8c;
        }

        .check-btn {
            background-color: #6c5ce7;
            color: white;
        }

        .chinese-hint {
            font-size: 1.2rem;
            text-align: center;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="../index.html" class="home-btn">🏠 回首頁</a>
        <div class="unit-title" id="unit-title">載入中...</div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">← 上一題</button>
        <span id="question-count">第 1 題 / 共 10 題</span>
        <button class="nav-btn" id="next-btn" onclick="nextQuestion()">下一題 →</button>
    </div>

    <div class="chinese-hint" id="chinese-hint">中文提示</div>
    <button class="audio-btn" onclick="playAudio()">🔊 聽發音</button>
    <div class="hint-text">依序點選字母，拼出正確單字</div>

    <div class="answer-box" id="answer-box">點選下方字母開始拼字</div>
    <div class="letter-pool" id="letter-pool"></div>

    <div class="action-btns">
        <button class="reset-btn" onclick="resetCurrentQuestion()">重新排列</button>
        <button class="check-btn" onclick="checkAnswer()">檢查答案</button>
    </div>
</div>

<script>
let currentWordData = { word: "", hint: "" };
let rawEnglishWord = ""; // 只包含純英文字母的答案
let selectedLetters = [];
let poolLetters = [];

// 解析單字資料：過濾中文與括號，純字母做題目
function parseRawWord(fullString) {
    // 假設輸入是 "green (綠色 空格)" 或 "adult (成人)"
    let match = fullString.match(/^(.*?)\s*[\(（](.*?)[\)）]/);
    
    let englishPart = fullString;
    let chinesePart = "";

    if (match) {
        englishPart = match[1];
        chinesePart = match[2];
    }

    // 只保留 a-z, A-Z，濾掉括號、空格與中文
    let cleanWord = englishPart.replace(/[^a-zA-Z]/g, '').toLowerCase();

    return {
        cleanWord: cleanWord,
        hint: chinesePart || fullString
    };
}

function loadWord(fullString) {
    const parsed = parseRawWord(fullString);
    rawEnglishWord = parsed.cleanWord;
    
    document.getElementById('chinese-hint').textContent = parsed.hint;

    // 將純英文字母打亂作為按鈕選項
    poolLetters = rawEnglishWord.split('').sort(() => Math.random() - 0.5);
    selectedLetters = [];

    renderPool();
    renderAnswer();
}

function renderPool() {
    const poolContainer = document.getElementById('letter-pool');
    poolContainer.innerHTML = '';

    poolLetters.forEach((letter, index) => {
        const btn = document.createElement('button');
        btn.className = 'letter-btn';
        btn.textContent = letter;
        btn.onclick = () => selectLetter(index);
        poolContainer.appendChild(btn);
    });
}

function renderAnswer() {
    const box = document.getElementById('answer-box');
    if (selectedLetters.length === 0) {
        box.textContent = '點選下方字母開始拼字';
        box.style.color = '#aaa';
    } else {
        box.textContent = selectedLetters.map(item => item.letter).join(' ');
        box.style.color = '#2d3436';
        box.style.fontSize = '1.4rem';
        box.style.fontWeight = 'bold';
    }
}

function selectLetter(index) {
    const btns = document.querySelectorAll('.letter-pool .letter-btn');
    if (btns[index].classList.contains('used')) return;

    btns[index].classList.add('used');
    selectedLetters.push({ letter: poolLetters[index], originalIndex: index });
    renderAnswer();
}

function resetCurrentQuestion() {
    selectedLetters = [];
    const btns = document.querySelectorAll('.letter-pool .letter-btn');
    btns.forEach(btn => btn.classList.remove('used'));
    renderAnswer();
}

function checkAnswer() {
    const userSpelling = selectedLetters.map(item => item.letter).join('');
    if (userSpelling === rawEnglishWord) {
        alert('🎉 太棒了！回答正確！');
    } else {
        alert('❌ 答錯囉，再試一次看看！');
    }
}

function playAudio() {
    if ('speechSynthesis' in window && rawEnglishWord) {
        const utterance = new SpeechSynthesisUtterance(rawEnglishWord);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    }
}

// 測試預設載入範例 (請替換為你的陣列載入邏輯)
loadWord("green (綠色 空格)");

</script>
</body>
</html>
