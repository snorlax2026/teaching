<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boost Up 2｜Nancy 老師</title><style>
:root{--ink:#5d4740;--purple:#745bc4;--yellow:#fff0b8}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif;background:radial-gradient(circle at 5% 9%,#ffdbe5 0 72px,transparent 74px),radial-gradient(circle at 95% 12%,#e4dcfa 0 90px,transparent 92px),#fffaf2}.app{width:min(1080px,calc(100% - 26px));margin:auto;padding:13px 0 30px}.top{display:grid;grid-template-columns:1fr auto;align-items:center;padding:18px 26px;border:3px solid #fff;border-radius:27px;background:linear-gradient(135deg,#fff,#fff0ec);box-shadow:0 11px 28px #6d554c1c}.tag{display:inline-block;padding:3px 11px;border-radius:999px;background:#e8defd;font-size:11px;font-weight:900}.top h1{margin:5px 0 2px;font-size:clamp(29px,4vw,43px)}.top p{margin:3px 0;color:#947970}.bear{font-size:72px;animation:float 3s ease-in-out infinite}.units{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:13px 0}.unit{padding:10px 4px;border:2px solid #e8ddef;border-radius:13px;background:#fff;color:#765f57;font-weight:900;cursor:pointer}.unit:hover,.unit.active{background:var(--purple);border-color:var(--purple);color:#fff}.launch{width:100%;margin-bottom:11px;padding:11px;border:0;border-radius:14px;background:var(--purple);color:#fff;font:inherit;font-weight:900;cursor:pointer}.panel,.quiz{padding:19px;border:3px solid #fff;border-radius:27px;background:#ffffffdf;box-shadow:0 11px 28px #6d554c1c}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.head h2{margin:0;font-size:22px}.badge{padding:6px 11px;border-radius:999px;background:var(--yellow);font-weight:900}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{position:relative;min-height:100px;padding:14px 37px 12px 14px;border:2px solid #f0dce2;border-radius:18px;background:#fff4f6;text-align:left;color:var(--ink);cursor:pointer}.card:nth-child(3n+2){background:#f5f1ff;border-color:#e1d8f3}.card:nth-child(3n){background:#f0faf5;border-color:#d6ecdf}.lesson{display:inline-block;margin-bottom:4px;padding:2px 7px;border-radius:999px;background:#fff;font-size:10px;font-weight:900;color:#967a70}.en{display:block;font-size:17px;font-weight:950}.zh{display:block;margin-top:5px;color:#92766d}.sound{position:absolute;right:11px;top:11px}.quiz{display:none;margin-top:12px;text-align:center}.quiz.open{display:block}.clue{margin:18px 0 5px;font-size:clamp(30px,5vw,45px);font-weight:950}.answer{min-height:65px;margin:14px 0;padding:10px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px;border:3px dashed #d7c8ed;border-radius:18px;background:#faf7ff}.answer.empty:after{content:'點選下方字母開始拼字';color:#ab9db5;font-weight:700}.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0}.letter,.chosen{width:48px;height:52px;border:2px solid var(--purple);border-radius:13px;background:#fff;color:#61449f;font-size:24px;font-weight:950;cursor:pointer;box-shadow:0 4px 0 #d6caeb}.letter:disabled{opacity:.18}.chosen{background:#f3edff}.feedback{min-height:30px;margin:8px;font-size:18px;font-weight:900}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.action{padding:10px 16px;border:0;border-radius:13px;background:#eee8f7;color:#604b76;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--purple);color:#fff}.listen{background:#dff2ff;color:#33789b}.home{display:inline-block;margin-top:13px;color:#7359ac;font-weight:900;text-decoration:none}@keyframes float{50%{transform:translateY(-5px)}}@media(max-width:800px){.units{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.bear{display:none}.top{padding:17px}.units{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.panel,.quiz{padding:14px}}@media(max-width:380px){.cards{grid-template-columns:1fr}}</style></head><body><main class="app"><header class="top"><div><span class="tag">NANCY'S VOCABULARY GARDEN</span><h1>Boost Up 2 單字樂園</h1><p>依照 Unit 與 Lesson 練習單字、片語和發音</p></div><div class="bear">🧸</div></header><nav class="units" id="units"></nav><button class="launch" id="startQuiz">🧩 開始本單元重組單字練習</button><section class="panel"><div class="head"><h2 id="title"></h2><span class="badge" id="count"></span></div><div class="cards" id="cards"></div></section><section class="quiz" id="quiz"><div class="head"><h2>🧩 重組單字練習</h2><span class="badge" id="progress"></span></div><div class="clue" id="clue"></div><button class="action listen" id="hear">🔊 聽發音</button><div class="answer empty" id="answer"></div><div class="letters" id="letters"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="action" id="undo">↩ 撤回</button><button class="action" id="mix">🔀 重新排列</button><button class="action primary" id="check">✓ 檢查答案</button><button class="action" id="next">跳過／下一題 →</button><button class="action" id="close">關閉練習</button></div></section><a class="home" href="index.html">🏠 回到單字練習首頁</a></main><script>
const units=[
[{l:2,e:'happy',z:'開心的'},{l:2,e:'sad',z:'難過的'},{l:2,e:'angry',z:'生氣的'},{l:2,e:'excited',z:'興奮的'},{l:2,e:'scared',z:'害怕的'},{l:2,e:'bored',z:'無聊的'},{l:3,e:'sleepy',z:'想睡的'},{l:3,e:'tired',z:'疲倦的'},{l:3,e:'hungry',z:'飢餓的'},{l:3,e:'thirsty',z:'口渴的'}],
[{l:2,e:'dog',z:'狗'},{l:2,e:'cat',z:'貓'},{l:2,e:'lizard',z:'蜥蜴'},{l:2,e:'turtle',z:'烏龜'},{l:2,e:'parrot',z:'鸚鵡'},{l:2,e:'spider',z:'蜘蛛'},{l:3,e:'big',z:'大的'},{l:3,e:'small',z:'小的'},{l:3,e:'fat',z:'胖的'},{l:3,e:'thin',z:'瘦的'},{l:3,e:'smart',z:'聰明的'},{l:3,e:'cute',z:'可愛的'}],
[{l:1,e:'play soccer',z:'踢足球'},{l:1,e:'play baseball',z:'打棒球'},{l:1,e:'play basketball',z:'打籃球'},{l:1,e:'play the piano',z:'彈鋼琴'},{l:1,e:'play the violin',z:'拉小提琴'},{l:1,e:'play the recorder',z:'吹直笛'},{l:3,e:'kick a ball',z:'踢球'},{l:3,e:'pass a ball',z:'傳球'},{l:3,e:'throw a ball',z:'丟球'},{l:3,e:'catch a ball',z:'接球'}],
[{l:2,e:'pilot',z:'飛行員'},{l:2,e:'chef',z:'廚師'},{l:2,e:'doctor',z:'醫生'},{l:2,e:'bus driver',z:'公車司機'},{l:2,e:'police officer',z:'警察'},{l:2,e:'firefighter',z:'消防員'},{l:3,e:'scientist',z:'科學家'},{l:3,e:'dancer',z:'舞者'},{l:3,e:'soccer player',z:'足球員'},{l:3,e:'farmer',z:'農夫'}],
[{l:2,e:'bike',z:'腳踏車'},{l:2,e:'drone',z:'無人機'},{l:2,e:'scooter',z:'滑板車'},{l:2,e:'skateboard',z:'滑板'},{l:2,e:'comic book',z:'漫畫書'},{l:2,e:'board game',z:'桌遊'},{l:3,e:'computer',z:'電腦'},{l:3,e:'tablet',z:'平板電腦'},{l:3,e:'smartphone',z:'智慧型手機'},{l:3,e:'video game',z:'電玩遊戲'}],
[{l:2,e:'home',z:'家'},{l:2,e:'school',z:'學校'},{l:2,e:'mall',z:'購物中心'},{l:2,e:'gym',z:'健身房'},{l:2,e:'park',z:'公園'},{l:2,e:'playground',z:'遊樂場'},{l:3,e:'sleeping',z:'正在睡覺'},{l:3,e:'eating',z:'正在吃東西'},{l:3,e:'shopping',z:'正在購物'},{l:3,e:'playing',z:'正在玩'}],
[{l:1,e:'living room',z:'客廳'},{l:1,e:'kitchen',z:'廚房'},{l:1,e:'garden',z:'花園'},{l:1,e:'bedroom',z:'臥室'},{l:1,e:'pool',z:'游泳池'},{l:1,e:'bathroom',z:'浴室'},{l:3,e:'gardening',z:'正在園藝'},{l:3,e:'cooking',z:'正在煮飯'},{l:3,e:'reading',z:'正在閱讀'},{l:3,e:'swimming',z:'正在游泳'}],
[{l:2,e:'hoodie',z:'連帽上衣'},{l:2,e:'skirt',z:'裙子'},{l:2,e:'T-shirt',z:'T恤'},{l:2,e:'shorts',z:'短褲'},{l:2,e:'pants',z:'長褲'},{l:2,e:'dress',z:'洋裝'},{l:3,e:'coat',z:'大衣'},{l:3,e:'jacket',z:'外套'},{l:3,e:'shoes',z:'鞋子'},{l:3,e:'socks',z:'襪子'}]
];let current=0,quizWords=[],q=0,tiles=[],chosen=[];const nav=document.querySelector('#units'),cards=document.querySelector('#cards'),title=document.querySelector('#title'),count=document.querySelector('#count'),quiz=document.querySelector('#quiz'),clue=document.querySelector('#clue'),answer=document.querySelector('#answer'),letters=document.querySelector('#letters'),feedback=document.querySelector('#feedback'),progress=document.querySelector('#progress');function speak(word){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.78;u.pitch=1.15;speechSynthesis.speak(u)}function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}const norm=s=>s.toLowerCase().replace(/[^a-z]/g,'');units.forEach((u,i)=>{const b=document.createElement('button');b.className='unit'+(i?'':' active');b.textContent=`Unit ${i+1}`;b.onclick=()=>show(i);nav.appendChild(b)});function show(i){current=i;document.querySelectorAll('.unit').forEach((b,n)=>b.classList.toggle('active',n===i));title.textContent=`Unit ${i+1}`;count.textContent=`${units[i].length} 個單字`;cards.innerHTML='';units[i].forEach(w=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<span class="sound">🔊</span><span class="lesson">Lesson ${w.l}</span><span class="en">${w.e}</span><span class="zh">${w.z}</span>`;b.onclick=()=>speak(w.e);cards.appendChild(b)})}function setup(){const w=quizWords[q];chosen=[];tiles=shuffle([...norm(w.e)].map((char,id)=>({char,id,used:false})));clue.textContent=w.z;progress.textContent=`第 ${q+1} 題／共 ${quizWords.length} 題`;feedback.textContent='';draw();speak(w.e)}function draw(){answer.innerHTML='';answer.classList.toggle('empty',!chosen.length);chosen.forEach(t=>{const b=document.createElement('button');b.className='chosen';b.textContent=t.char;b.onclick=()=>remove(t);answer.appendChild(b)});letters.innerHTML='';tiles.forEach(t=>{const b=document.createElement('button');b.className='letter';b.textContent=t.char;b.disabled=t.used;b.onclick=()=>{t.used=true;chosen.push(t);feedback.textContent='';draw()};letters.appendChild(b)})}function remove(t){t.used=false;chosen=chosen.filter(x=>x!==t);feedback.textContent='';draw()}function next(){q=(q+1)%quizWords.length;setup()}document.querySelector('#startQuiz').onclick=()=>{quizWords=shuffle([...units[current]]);q=0;quiz.classList.add('open');setup();quiz.scrollIntoView({behavior:'smooth'})};document.querySelector('#hear').onclick=()=>speak(quizWords[q].e);document.querySelector('#undo').onclick=()=>chosen.length&&remove(chosen[chosen.length-1]);document.querySelector('#mix').onclick=()=>{chosen.forEach(t=>t.used=false);chosen=[];shuffle(tiles);feedback.textContent='';draw()};document.querySelector('#check').onclick=()=>{const right=norm(quizWords[q].e),got=chosen.map(t=>t.char).join('');if(got===right){feedback.textContent=`🎉 答對了！${quizWords[q].e}`;feedback.style.color='#39835c';speak(quizWords[q].e)}else{feedback.textContent=got.length<right.length?'還有字母沒選完喔！':'再試一次，你快答對了！';feedback.style.color='#c45d75'}};document.querySelector('#next').onclick=next;document.querySelector('#close').onclick=()=>{quiz.classList.remove('open');speechSynthesis.cancel()};show(0);</script></body></html>
